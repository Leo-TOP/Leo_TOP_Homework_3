<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Шпаргалка по классическим алгоритмам: сортировки, графы, динамика." />
      <title>Классические алгоритмы</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body>

    <main class="page" id="collection">
      <section class="intro" aria-labelledby="page-title">
        <p class="intro__eyebrow">Известные алгоритмы</p>
        <h1 id="page-title">Сортировка,<br />обход графов и динамика</h1>
        <p class="intro__lead">Выберите карточку, отфильтруйте коллекцию или доверьте выбор случаю.</p>
      </section>

      <section class="workspace" aria-label="Интерактивная коллекция">
        <div class="catalog">
          <div class="toolbar">
            <div class="filters" aria-label="Фильтр коллекции">
              <button
                class="filter-button filter-button--active"
                type="button"
                data-filter="all"
                aria-pressed="true"
              >
                Все
            </button>
              <button class="filter-button" 
              type="button" data-filter="sorting" 
              aria-pressed="false">Сортировки</button>

              <button class="filter-button" 
              type="button" data-filter="graphs" 
              aria-pressed="false">Графы</button>

              <button class="filter-button" 
              type="button" 
              data-filter="dp" 
              aria-pressed="false">Динамика</button>
            </div>

            <p class="result-count" aria-live="polite">
              Показано карточек: <strong id="visible-count">7</strong>
            </p>
          </div>

                    <div class="collection-grid">
            <button
              class="collection-card"
              type="button"
              data-title="Quicksort"
              data-description="Быстрая сортировка с опорным элементом. O(n log n) в среднем, O(n²) в худшем случае."
              data-category="sorting"
              aria-controls="details-panel"
              aria-pressed="false"
            >
              <span class="collection-card__meta">
                <span>01</span><span>Сортировки</span>
              </span>
              <span class="collection-card__symbol" aria-hidden="true">&lt;/&gt;</span>
              <span class="collection-card__title">Quicksort</span>
              <span class="collection-card__summary">Опорный элемент и разделение</span>
            </button>

            <button
              class="collection-card"
              type="button"
              data-title="Merge Sort"
              data-description="Сортировка слиянием. Стабильная, всегда O(n log n), требует O(n) дополнительной памяти."
              data-category="sorting"
              aria-controls="details-panel"
              aria-pressed="false"
            >
              <span class="collection-card__meta">
                <span>02</span><span>Сортировки</span>
              </span>
              <span class="collection-card__symbol" aria-hidden="true">{ }</span>
              <span class="collection-card__title">Merge Sort</span>
              <span class="collection-card__summary">Разделяй и сливай</span>
            </button>

            <button
              class="collection-card"
              type="button"
              data-title="DFS"
              data-description="Поиск в глубину. Обход графа по ветвям с возвратом. Сложность O(V + E)."
              data-category="graphs"
              aria-controls="details-panel"
              aria-pressed="false"
            >
              <span class="collection-card__meta">
                <span>03</span><span>Графы</span>
              </span>
              <span class="collection-card__symbol" aria-hidden="true">↓</span>
              <span class="collection-card__title">DFS</span>
              <span class="collection-card__summary">Идём вглубь до упора</span>
            </button>

            <button
              class="collection-card"
              type="button"
              data-title="BFS"
              data-description="Поиск в ширину. Обход графа по уровням, кратчайший путь в невзвешенном графе. O(V + E)."
              data-category="graphs"
              aria-controls="details-panel"
              aria-pressed="false"
            >
              <span class="collection-card__meta">
                <span>04</span><span>Графы</span>
              </span>
              <span class="collection-card__symbol" aria-hidden="true">◇</span>
              <span class="collection-card__title">BFS</span>
              <span class="collection-card__summary">Обход по уровням</span>
            </button>

            <button
              class="collection-card"
              type="button"
              data-title="Задача о рюкзаке"
              data-description="0/1 Knapsack: максимум ценности при ограничении веса. DP-состояние dp[i][w], сложность O(n·W)."
              data-category="dp"
              aria-controls="details-panel"
              aria-pressed="false"
            >
              <span class="collection-card__meta">
                <span>05</span><span>Динамика</span>
              </span>
              <span class="collection-card__symbol" aria-hidden="true">↗</span>
              <span class="collection-card__title">Задача о рюкзаке</span>
              <span class="collection-card__summary">Максимум ценности при весе</span>
            </button>

            <button
              class="collection-card"
              type="button"
              data-title="LCS"
              data-description="Наибольшая общая подпоследовательность двух строк. DP-состояние dp[i][j], сложность O(n·m)."
              data-category="dp"
              aria-controls="details-panel"
              aria-pressed="false"
            >
              <span class="collection-card__meta">
                <span>06</span><span>Динамика</span>
              </span>
              <span class="collection-card__symbol" aria-hidden="true">≋</span>
              <span class="collection-card__title">LCS</span>
              <span class="collection-card__summary">Общая подпоследовательность</span>
            </button>

                 <button
              class="collection-card"
              type="button"
              data-title="A*"
              data-description="Поиск кратчайшего пути с эвристикой. Находит оптимум быстрее Dijkstra за счёт оценки расстояния до цели."
              data-category="graphs"
              aria-controls="details-panel"
              aria-pressed="false"
            >
              <span class="collection-card__meta">
                <span>07</span><span>Графы</span>
              </span>
              <span class="collection-card__symbol" aria-hidden="true">★</span>
              <span class="collection-card__title">A*</span>
              <span class="collection-card__summary">Путь с эвристикой</span>
            </button>
          </div>
        </div>

        <aside
          class="details-panel"
          id="details-panel"
          aria-labelledby="details-title"
          aria-live="polite"
        >
          <div class="details-panel__top">
            <span class="details-panel__label">Выбранный элемент</span>
            <span class="details-panel__marker" aria-hidden="true"></span>
          </div>

          <div class="details-panel__content">
            <h2 id="details-title">Выберите карточку</h2>
            <p id="details-description">
              Нажмите на карточку, чтобы увидеть описание алгоритма.
            </p>
          </div>

          <div class="details-panel__actions">
            <button class="action-button action-button--primary" id="random-button" type="button">
              Случайный выбор <span aria-hidden="true">↗</span>
            </button>
            <button class="action-button" id="reset-button" type="button">Сбросить</button>
          </div>
        </aside>
      </section>

    </main>

    <footer class="site-footer">
      <a href="#collection">Наверх ↑</a>
    </footer>
  </body>
</html>
